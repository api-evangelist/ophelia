name: Ophelia
description: >-
  Ophelia is a telehealth company delivering online treatment for opioid use
  disorder (OUD) through medication-assisted treatment (MAT). Founded in 2020 and
  based in Philadelphia, Ophelia combines evidence-based buprenorphine/naloxone
  (Suboxone) prescriptions with virtual clinical care, delivering diagnosis,
  prescriptions sent to local pharmacies, ongoing clinician support, and insurance
  coordination entirely remotely. Patients can be seen within 1-3 days and most pay
  under $10/month. Ophelia is a consumer-facing healthcare provider and does not
  publish a public developer API, SDK, or developer portal; this profile is
  maintained in the API Evangelist network as a company record.
